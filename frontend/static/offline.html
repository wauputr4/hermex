<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4c15d" />
    <title>Hermex Offline</title>
    <style>
      :root { color: #45304f; background: #fff8df; font-family: Avenir Next, Nunito, Trebuchet MS, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 20% 20%, rgba(244,193,93,.5), transparent 22rem), radial-gradient(circle at 80% 8%, rgba(128,213,187,.45), transparent 20rem), linear-gradient(145deg, #fff8df, #f5e4ee 58%, #dff5ed); }
      main { width: min(520px, calc(100vw - 32px)); border: 4px solid rgba(69,48,79,.12); border-radius: 34px; padding: 28px; background: rgba(255,253,247,.9); box-shadow: 0 24px 70px rgba(69,48,79,.16); }
      svg { width: 74px; height: 74px; fill: #fff2aa; stroke: #45304f; stroke-width: 4; }
      svg path:last-child { fill: #f09d73; }
      h1 { margin: 14px 0 8px; font-size: clamp(2rem, 9vw, 4rem); line-height: .9; letter-spacing: -.06em; }
      p { color: rgba(69,48,79,.72); line-height: 1.55; font-weight: 800; }
      a { display: inline-flex; margin-top: 12px; border-radius: 999px; padding: 12px 16px; background: #45304f; color: #fff8df; font-weight: 900; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="25"/><path d="M32 10l7 15 15 7-15 7-7 15-7-15-15-7 15-7 7-15z"/></svg>
      <h1>Hermex sedang offline.</h1>
      <p>Draft, history guest, dan halaman edukasi yang sudah tersimpan masih bisa dibuka dari aplikasi. Sambungkan internet lagi untuk memakai Hermex AI.</p>
      <a href="/">Buka Hermex</a>
    </main>
  </body>
</html>
