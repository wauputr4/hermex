<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fbfaf6" />
    <meta
      name="description"
      content="Hermex Fun is an open-source personality analysis app based on birth place, date, and time."
    />
    <meta name="application-name" content="Hermex Fun" />
    <link rel="icon" href="/icons/hermex-star.svg" type="image/svg+xml" />
    <meta property="og:site_name" content="Hermex Fun" />
    <title>Hermex Fun</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html { background: #fbfaf6; color: #302a36; font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif; }
      body { margin: 0; min-width: 320px; background: radial-gradient(circle at 5% 0%, rgba(241,184,106,.12), transparent 32rem), #fbfaf6; }
      button, input { font: inherit; }
      button:focus-visible, a:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid #5b55d6; outline-offset: 3px; }
    </style>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Hermex Fun",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web",
        "url": "https://hermex.fun/",
        "image": "https://hermex.fun/hermex-social-preview.png",
        "description": "Open-source AI personality analysis based on birth place, date, and time for reflective self-discovery.",
        "codeRepository": "https://github.com/wauputr4/hermex",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
